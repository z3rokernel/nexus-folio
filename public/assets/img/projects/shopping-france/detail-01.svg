<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#06080F"/>
  <text x="80" y="75" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#D4FF1F" letter-spacing="3">EXHIBIT 01 // END-TO-END COD ORDER &amp; SMS/EMAIL API ARCHITECTURE</text>
  <text x="80" y="115" font-family="Syne, sans-serif" font-size="36" font-weight="800" fill="#EDEFF5">SHOPPINGFRANCE.STORE — SYSTEM DATAFLOW</text>

  <!-- Step 1: Social Ad Acquisition -->
  <g transform="translate(80, 180)">
    <rect width="260" height="520" rx="18" fill="#0C101C" stroke="#7B5CFF" stroke-width="2"/>
    <text x="28" y="48" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#7B5CFF">STAGE 01 // TRAFFIC</text>
    <text x="28" y="84" font-family="Syne, sans-serif" font-size="22" font-weight="800" fill="#EDEFF5">Social Ads Funnel</text>
    <text x="28" y="125" font-family="Inter, sans-serif" font-size="14" fill="#8A90A6">• Campagnes Facebook &amp; Instagram</text>
    <text x="28" y="155" font-family="Inter, sans-serif" font-size="14" fill="#8A90A6">• Landing pages Tailwind CSS</text>
    <text x="28" y="185" font-family="Inter, sans-serif" font-size="14" fill="#8A90A6">• Temps de chargement &lt; 1.2s</text>
    <rect x="28" y="230" width="204" height="110" rx="12" fill="#13192B"/>
    <text x="44" y="268" font-family="JetBrains Mono, monospace" font-size="12" fill="#EDEFF5">UTM Tracking &amp; Pixel</text>
    <text x="44" y="295" font-family="JetBrains Mono, monospace" font-size="12" fill="#D4FF1F">Mobile Traffic: 88%</text>
  </g>

  <!-- Arrow 1->2 -->
  <path d="M 345 440 L 395 440" stroke="#D4FF1F" stroke-width="3"/>

  <!-- Step 2: CodeIgniter 4 Controller & Validation -->
  <g transform="translate(400, 180)">
    <rect width="270" height="520" rx="18" fill="#0C101C" stroke="#D4FF1F" stroke-width="2"/>
    <text x="28" y="48" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#D4FF1F">STAGE 02 // BACKEND</text>
    <text x="28" y="84" font-family="Syne, sans-serif" font-size="22" font-weight="800" fill="#EDEFF5">CodeIgniter 4 MVC</text>
    <text x="28" y="125" font-family="Inter, sans-serif" font-size="14" fill="#8A90A6">• Protection CSRF &amp; Anti-Bot</text>
    <text x="28" y="155" font-family="Inter, sans-serif" font-size="14" fill="#8A90A6">• Validation stricte téléphone FR</text>
    <text x="28" y="185" font-family="Inter, sans-serif" font-size="14" fill="#8A90A6">• Dédoublonnage commandes</text>
    <rect x="28" y="230" width="214" height="140" rx="12" fill="#13192B"/>
    <text x="44" y="265" font-family="JetBrains Mono, monospace" font-size="12" fill="#2DE2E6">OrderController::store()</text>
    <text x="44" y="292" font-family="JetBrains Mono, monospace" font-size="11" fill="#8A90A6">1. Validate Input Rules</text>
    <text x="44" y="315" font-family="JetBrains Mono, monospace" font-size="11" fill="#8A90A6">2. Verify Stock Lock</text>
    <text x="44" y="338" font-family="JetBrains Mono, monospace" font-size="11" fill="#D4FF1F">3. Commit MySQL Tx</text>
  </g>

  <!-- Arrow 2->3 -->
  <path d="M 675 440 L 725 440" stroke="#D4FF1F" stroke-width="3"/>

  <!-- Step 3: MySQL Relational Schema -->
  <g transform="translate(730, 180)">
    <rect width="260" height="520" rx="18" fill="#0C101C" stroke="#2DE2E6" stroke-width="2"/>
    <text x="28" y="48" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#2DE2E6">STAGE 03 // SQL DATA</text>
    <text x="28" y="84" font-family="Syne, sans-serif" font-size="22" font-weight="800" fill="#EDEFF5">MySQL 8 Database</text>
    <text x="28" y="125" font-family="Inter, sans-serif" font-size="14" fill="#8A90A6">• Tables normalisées (3NF)</text>
    <text x="28" y="155" font-family="Inter, sans-serif" font-size="14" fill="#8A90A6">• Décrémentation stock atomique</text>
    <text x="28" y="185" font-family="Inter, sans-serif" font-size="14" fill="#8A90A6">• Historique statuts COD</text>
    <rect x="28" y="230" width="204" height="160" rx="12" fill="#13192B"/>
    <text x="44" y="265" font-family="JetBrains Mono, monospace" font-size="12" fill="#D4FF1F">TABLES:</text>
    <text x="44" y="290" font-family="JetBrains Mono, monospace" font-size="12" fill="#EDEFF5">• products / variants</text>
    <text x="44" y="315" font-family="JetBrains Mono, monospace" font-size="12" fill="#EDEFF5">• orders (COD status)</text>
    <text x="44" y="340" font-family="JetBrains Mono, monospace" font-size="12" fill="#EDEFF5">• order_items</text>
    <text x="44" y="365" font-family="JetBrains Mono, monospace" font-size="12" fill="#2DE2E6">• api_notification_logs</text>
  </g>

  <!-- Arrow 3->4 -->
  <path d="M 995 440 L 1045 440" stroke="#D4FF1F" stroke-width="3"/>

  <!-- Step 4: Third-Party SMS & Email REST APIs -->
  <g transform="translate(1050, 180)">
    <rect width="470" height="520" rx="18" fill="#0C101C" stroke="#D4FF1F" stroke-width="2"/>
    <text x="28" y="48" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#D4FF1F">STAGE 04 // EXTERNAL REST APIS &amp; QA</text>
    <text x="28" y="84" font-family="Syne, sans-serif" font-size="22" font-weight="800" fill="#EDEFF5">SMS &amp; Email Dispatch</text>

    <rect x="28" y="115" width="414" height="160" rx="12" fill="#13192B" stroke="#D4FF1F" stroke-opacity="0.4"/>
    <text x="48" y="148" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#D4FF1F">1. REST SMS API (cURL / Webhook)</text>
    <text x="48" y="176" font-family="Inter, sans-serif" font-size="14" fill="#EDEFF5">Envoi automatique du SMS de confirmation client</text>
    <text x="48" y="202" font-family="Inter, sans-serif" font-size="13" fill="#8A90A6">Réduit drastiquement les refus de colis à la livraison (NPAI)</text>
    <text x="48" y="236" font-family="JetBrains Mono, monospace" font-size="12" fill="#2DE2E6">POST /v1/sms/send → HTTP 200 OK (Log enregistré)</text>

    <rect x="28" y="300" width="414" height="175" rx="12" fill="#13192B" stroke="#2DE2E6" stroke-opacity="0.4"/>
    <text x="48" y="335" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#2DE2E6">2. Transactional Email API &amp; Admin Alert</text>
    <text x="48" y="365" font-family="Inter, sans-serif" font-size="14" fill="#EDEFF5">Email récapitulatif HTML + notification préparation colis</text>
    <text x="48" y="395" font-family="Inter, sans-serif" font-size="13" fill="#8A90A6">Tests Postman &amp; scripts de relance automatique en cas de timeout</text>
    <text x="48" y="435" font-family="JetBrains Mono, monospace" font-size="12" fill="#D4FF1F">✓ 100% Traçabilité SQL des appels API</text>
  </g>
</svg>